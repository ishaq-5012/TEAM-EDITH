[project]
name = "verifyflow-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "S105", "S106", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E402"]
"alembic/env.py" = ["E402"]
# Human-readable explanation templates: one sentence per line reads better than wrapped fragments.
"app/evidence/explain.py" = ["E501"]
# Regex pattern tables: one pattern per line reads better than split string fragments.
"app/assist/guard.py" = ["E501"]
"app/assist/egress.py" = ["E501"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
